    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script></script>
    <title>Web Crochet xo </title>
</head>
<body>
    <main>

        <section class="containerwelcomandlogo">

            <div class="welcomen" id="welcome">

                <div class="welcomeContainer">
                    <span>¡</span>

    <div class="progress" aria-label="Secciones">
      <button class="active" type="button" data-go="0" aria-label="Inicio"></button>
      <button type="button" data-go="1" aria-label="Coleccion"></button>
      <button type="button" data-go="2" aria-label="Personalizado"></button>

    <div class="hint">Rueda, desliza o usa los puntos</div>

  <script src="Gsap/gsap-public%20(1)/gsap-public/minified/gsap.min.js"></script>
  <script src="Gsap/gsap-public%20(1)/gsap-public/minified/Observer.min.js"></script>
  <script src="Gsap/gsap-public%20(1)/gsap-public/minified/SplitText.min.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      gsap.registerPlugin(Observer, SplitText);

      const sections = document.querySelectorAll(".section");
      const images = document.querySelectorAll(".bg");
      const headings = gsap.utils.toArray(".section-heading");
      const outerWrappers = gsap.utils.toArray(".outer");
      const innerWrappers = gsap.utils.toArray(".inner");
      const dots = gsap.utils.toArray(".progress button");
      const splitHeadings = headings.map(function (heading) {
        return new SplitText(heading, { type: "chars,words,lines", linesClass: "clip-text" });
      });

      let currentIndex = -1;
      let animating = false;
      const wrap = gsap.utils.wrap(0, sections.length);

      gsap.set(outerWrappers, { yPercent: 100 });
      gsap.set(innerWrappers, { yPercent: -100 });
      gsap.set(sections, { autoAlpha: 0 });

      function setActiveDot(index) {
        dots.forEach(function (dot, dotIndex) {
          dot.classList.toggle("active", dotIndex === index);
        });
      }

      function gotoSection(index, direction) {
        const nextIndex = wrap(index);
        if (animating || nextIndex === currentIndex) return;

        animating = true;
        const fromTop = direction === -1;
        const dFactor = fromTop ? -1 : 1;
        const tl = gsap.timeline({
          defaults: { duration: 1.25, ease: "power1.inOut" },
          onComplete: function () { animating = false; }
        });

        if (currentIndex >= 0) {
          gsap.set(sections[currentIndex], { zIndex: 0 });
          tl.to(images[currentIndex], { yPercent: -15 * dFactor }, 0)
            .set(sections[currentIndex], { autoAlpha: 0 });
        }

        gsap.set(sections[nextIndex], { autoAlpha: 1, zIndex: 1 });

        tl.fromTo([outerWrappers[nextIndex], innerWrappers[nextIndex]], {
          yPercent: function (i) { return i ? -100 * dFactor : 100 * dFactor; }
        }, {
          yPercent: 0
        }, 0)
          .fromTo(images[nextIndex], { yPercent: 15 * dFactor }, { yPercent: 0 }, 0)
          .fromTo(splitHeadings[nextIndex].chars, {
            autoAlpha: 0,
            yPercent: 150 * dFactor
          }, {
            autoAlpha: 1,
            yPercent: 0,
            duration: 1,
            ease: "power2",
            stagger: { each: 0.02, from: "random" }
          }, 0.2)
          .fromTo(sections[nextIndex].querySelectorAll(".eyebrow, .copy p, .meta span, .section-button, .doll, .product-card"), {
            autoAlpha: 0,
            y: 34 * dFactor
          }, {
            autoAlpha: 1,
            y: 0,
            duration: .75,
            stagger: .045,
            ease: "power2.out"
          }, 0.42);

        currentIndex = nextIndex;
        setActiveDot(nextIndex);
        history.replaceState(null, "", "#" + sections[nextIndex].id);
      }

      Observer.create({
        type: "wheel,touch,pointer",
        wheelSpeed: -1,
        onDown: function () { if (!animating) gotoSection(currentIndex - 1, -1); },
        onUp: function () { if (!animating) gotoSection(currentIndex + 1, 1); },
        tolerance: 10,
        preventDefault: true
      });

      document.querySelectorAll("[data-go]").forEach(function (control) {
        control.addEventListener("click", function (event) {
          const target = Number(control.dataset.go);
          if (Number.isNaN(target)) return;
          event.preventDefault();
          gotoSection(target, target > currentIndex ? 1 : -1);
        });
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown" || event.key === "PageDown") gotoSection(currentIndex + 1, 1);
        if (event.key === "ArrowUp" || event.key === "PageUp") gotoSection(currentIndex - 1, -1);
      });

      const initialHashIndex = Array.from(sections).findIndex(function (section) {
        return "#" + section.id === window.location.hash;
      });

      gotoSection(initialHashIndex >= 0 ? initialHashIndex : 0, 1);
    });
  </script>
</body>
</html>
